        additionalProperties:
          additionalProperties:
            type: string
          type: object
        type: object
      maxFeatureRequestsPerUser:
        type: integer
      maxVotesPerUser:
        type: integer
      supportRequest:
        $ref: '#/definitions/consoleUpdateSupportRequestSettings'
    type: object
  consoleUpdateGitHubIntegrationRequest:
    properties:
      owner:
        example: acme-corp
        type: string
      repo:
        example: webapp
        type: string
      token:
        example: ghp_...
        type: string
    required:
    - owner
    - repo
    - token
    type: object
  consoleUpdateMyPasswordRequest:
    properties:
      currentPassword:
        minLength: 1
        type: string
      newPassword:
        minLength: 10
        type: string
    required:
    - currentPassword
    - newPassword
    type: object
  consoleUpdateMyProfileRequest:
    properties:
      imageUrl:
        type: string
      name:
        type: string
    type: object
  consoleUpdatePortalSettings:
    properties:
      authUrl:
        type: string
      customAuthButtonText:
        type: string
      customAuthEnabled:
        type: boolean
      googleAuthEnabled:
        type: boolean
      googleClientId:
        type: string
    type: object
  consoleUpdateReleasePdf:
    properties:
      name:
        maxLength: 255
        type: string
      size:
        type: integer
      url:
        maxLength: 500
        type: string
    type: object
  consoleUpdateReleaseRequest:
    properties:
      description:
        maxLength: 10000
        type: string
      pdfFile:
        allOf:
        - $ref: '#/definitions/consoleUpdateReleasePdf'
        description: |-
          PdfFile carries the attachment slot for the release. The
          triple is applied together: an empty URL clears the slot
          (and is the only way to remove an existing attachment). nil
          pointer leaves the existing PDF untouched.
      releaseDate:
        type: string
      state:
        type: string
      title:
        maxLength: 200
        type: string
      versionName:
        maxLength: 60
        minLength: 1
        type: string
    type: object
  consoleUpdateSettingsRequest:
    properties:
      feedback:
        $ref: '#/definitions/consoleUpdateFeedbackSettings'
      logoUrl:
        type: string
      portal:
        $ref: '#/definitions/consoleUpdatePortalSettings'
      primaryColor:
        type: string
      projectName:
        type: string
      uploads:
        $ref: '#/definitions/consoleUpdateUploadsSettings'
    type: object
  consoleUpdateSupportRequestSettings:
    properties:
      enabled:
        type: boolean
      url:
        type: string
    type: object
  consoleUpdateUploadsSettings:
    properties:
      backend:
        type: string
      enabled:
        type: boolean
      gcsBucket:
        type: string
    type: object
  consoleUpdateUserBlockRequest:
    properties:
      isBlocked:
        example: true
        type: boolean
    type: object
  consoleUpdateUserRolesRequest:
    properties:
      roles:
        example:
        - admin
        - editor
        items:
          type: string
        type: array
    required:
    - roles
    type: object
  loginRequest:
    properties:
      email:
        type: string
      password:
        minLength: 1
        type: string
    required:
    - email
    - password
    type: object
  portalCreateCommentRequest:
    properties:
      body:
        maxLength: 10000
        minLength: 1
        type: string
    required:
    - body
    type: object
  portalFindSimilarRequest:
    properties:
      description:
        example: A system-aware toggle would be great.
        type: string
      title:
        example: Add dark mode
        maxLength: 200
        minLength: 3
        type: string
    required:
    - title
    type: object
  portalLoginCustomRequest:
    properties:
      token:
        minLength: 1
        type: string
    required:
    - token
    type: object
  portalLoginCustomResponse:
    properties:
      user:
        $ref: '#/definitions/PortalUserInfo'
    type: object
  portalLoginGoogleRequest:
    properties:
      idToken:
        minLength: 1
        type: string
    required:
    - idToken
    type: object
  portalLoginGoogleResponse:
    properties:
      user:
        $ref: '#/definitions/PortalUserInfo'
    type: object
  portalSubmitEntryRequest:
    properties:
      description:
        example: Would love a system-aware dark mode toggle.
        type: string
      entryType:
        example: feature-request
        type: string
      isInternal:
        type: boolean
      title:
        example: Add dark mode
        maxLength: 200
        minLength: 3
        type: string
    required:
    - title
    type: object
  setupRequest:
    properties:
      adminEmail:
        type: string
      adminPassword:
        minLength: 10
        type: string
      projectName:
        maxLength: 120
        minLength: 1
        type: string
    required:
    - adminEmail
    - adminPassword
    - projectName
    type: object
host: localhost:8080
info:
  contact: {}
  description: |-
    Open-source feedback portal with an admin console.
    Single tenant per deployment. Authentication via HTTPOnly session cookie.
  title: Mixdive API
  version: 0.1.0
paths:
  /api/console/administrator:
    get:
      operationId: console-list-administrators
