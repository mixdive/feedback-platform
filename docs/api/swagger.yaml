          type: integer
        type: object
      pendingByName:
        additionalProperties:
          type: integer
        type: object
      pollInterval:
        type: string
      totalAnalyzed:
        description: |-
          TotalAnalyzed is the cumulative count of successful analyzer
          runs over this deployment's lifetime, sourced from
          Settings.AI.TotalAnalyzed which is $inc'd atomically per success.
        type: integer
      totalInFlight:
        type: integer
      totalPending:
        type: integer
    type: object
  consoleAddEntryRelationRequest:
    properties:
      peerEntryId:
        type: string
      type:
        type: string
    required:
    - peerEntryId
    - type
    type: object
  consoleCreateEntryTopicRequest:
    properties:
      color:
        maxLength: 32
        type: string
      description:
        maxLength: 240
        type: string
      sortOrder:
        type: integer
      title:
        maxLength: 60
        minLength: 1
        type: string
    required:
    - title
    type: object
  consoleCreateReleaseRequest:
    properties:
      description:
        maxLength: 10000
        type: string
      pdfFileName:
        maxLength: 255
        type: string
      pdfFileSize:
        type: integer
      pdfFileUrl:
        description: |-
          Optional PDF attachment. URL is the relative path returned by
          the upload endpoint (/api/files/...); Name is the original
          uploader filename rendered next to the download link; Size is
          in bytes. All three travel together — pass either the full
          trio or none.
        maxLength: 500
        type: string
      releaseDate:
        type: string
      state:
        type: string
      title:
        maxLength: 200
        type: string
      versionName:
        maxLength: 60
        minLength: 1
        type: string
    required:
    - versionName
    type: object
