        maxLength: 32
        type: string
      description:
        maxLength: 240
        type: string
      sortOrder:
        type: integer
      title:
        maxLength: 60
        minLength: 1
        type: string
    type: object
  consoleUpdateFeedbackSettings:
    properties:
