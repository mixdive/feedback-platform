name: release

# Single source of truth for a release: pushing a semver tag (e.g. v0.1.0).
#   git tag v0.1.0
#   git push origin v0.1.0
#
# This builds the Docker image once and publishes it to BOTH registries, then
# cuts a GitHub Release with auto-generated notes.
#
#   - GHCR:        ghcr.io/mixdive/feedback-platform
#   - Docker Hub:  mixdive/feedback-platform
#
# GHCR auth uses the built-in GITHUB_TOKEN (no setup). Docker Hub needs two
# repository secrets: DOCKERHUB_USERNAME and DOCKERHUB_TOKEN (an access token,
# NOT your account password — create one at hub.docker.com → Account Settings →
# Personal access tokens, scope Read/Write).

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write   # create the GitHub Release
  packages: write   # push to GHCR

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Derive image tags from the git tag. A push of v0.1.0 yields:
      #   :0.1.0  :0.1  :latest   on each registry.
      - name: Compute image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/mixdive/feedback-platform
            docker.io/mixdive/feedback-platform
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            ## Mixdive ${{ github.ref_name }}

            ### Docker images
            ```
            docker pull ghcr.io/mixdive/feedback-platform:${{ steps.meta.outputs.version }}
            docker pull mixdive/feedback-platform:${{ steps.meta.outputs.version }}
            ```
