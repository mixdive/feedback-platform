<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mixdive · First-run setup</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/svg+xml" href="/mixdive-favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<style>
  :root { color-scheme: light; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
         background: #fafafa; color: #18181b; margin: 0; padding: 48px 16px; }
  .wrap { max-width: 480px; margin: 0 auto; }
  .brand { display: flex; justify-content: center; margin-bottom: 24px; }
  .brand svg { height: 40px; width: auto; }
  h1 { font-size: 24px; margin: 0 0 8px; }
  p.lead { color: #52525b; margin: 0 0 24px; }
  form { background: #fff; border: 1px solid #e4e4e7; border-radius: 12px; padding: 24px;
         box-shadow: 0 1px 2px rgba(0,0,0,0.04); }
  label { display: block; font-size: 13px; font-weight: 500; margin: 16px 0 6px; }
  label:first-of-type { margin-top: 0; }
  input[type=text], input[type=email], input[type=password] {
    width: 100%; box-sizing: border-box; padding: 10px 12px; font-size: 14px;
    border: 1px solid #d4d4d8; border-radius: 8px; background: #fff; color: #18181b; }
  input:focus { outline: 2px solid #3b82f6; outline-offset: -1px; border-color: transparent; }
  .row { display: flex; align-items: center; gap: 8px; margin-top: 16px; font-size: 13px; color: #3f3f46; }
  .row input { width: auto; }
  button { margin-top: 24px; width: 100%; padding: 10px 16px; font-size: 14px; font-weight: 500;
           background: #18181b; color: #fff; border: 0; border-radius: 8px; cursor: pointer; }
  button:disabled { opacity: 0.5; cursor: progress; }
  .err { display: none; margin-top: 12px; padding: 10px 12px; font-size: 13px;
         background: #fef2f2; color: #991b1b; border: 1px solid #fecaca; border-radius: 8px; }
  .hint { font-size: 12px; color: #71717a; margin-top: 4px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="brand" aria-hidden="true">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 270 50" role="img" aria-label="Mixdive">
      <title>Mixdive</title>
      <g>
        <rect x="20" y="2" width="20" height="10" rx="5" fill="#0B2545"/>
        <rect x="10" y="20" width="40" height="10" rx="5" fill="#0B2545"/>
        <rect x="0" y="38" width="60" height="10" rx="5" fill="#2EC4B6"/>
      </g>
      <text x="80" y="42" font-family="Inter, 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="48" font-weight="500" letter-spacing="-1.2" fill="#0B2545">Mixdive</text>
    </svg>
  </div>
  <h1>Welcome to Mixdive</h1>
  <p class="lead">Fill this out once to finish setting up your deployment.</p>
  <form id="f">
    <label for="projectName">Project name</label>
    <input id="projectName" name="projectName" type="text" required minlength="1" maxlength="120" autocomplete="organization">

    <label for="adminEmail">Admin email</label>
    <input id="adminEmail" name="adminEmail" type="email" required autocomplete="email">

    <label for="adminPassword">Admin password</label>
    <input id="adminPassword" name="adminPassword" type="password" required minlength="10" autocomplete="new-password">
    <div class="hint">At least 10 characters.</div>

    <button id="b" type="submit">Finish setup</button>
    <div id="err" class="err"></div>
  </form>
</div>
<script>
(function () {
  var f = document.getElementById("f");
  var b = document.getElementById("b");
  var err = document.getElementById("err");
  f.addEventListener("submit", function (ev) {
    ev.preventDefault();
    err.style.display = "none";
    b.disabled = true;
    b.textContent = "Setting up…";
    var body = {
      projectName: f.projectName.value.trim(),
      adminEmail: f.adminEmail.value.trim(),
      adminPassword: f.adminPassword.value,
    };
    fetch("/api/setup", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
      credentials: "same-origin",
    }).then(function (r) {
      return r.json().then(function (j) { return { status: r.status, body: j }; });
    }).then(function (res) {
      if (res.status >= 200 && res.status < 300) {
        window.location.href = "/console/";
        return;
      }
      err.textContent = (res.body && res.body.message) || ("Setup failed (" + res.status + ").");
      err.style.display = "block";
      b.disabled = false;
      b.textContent = "Finish setup";
    }).catch(function (e) {
      err.textContent = e && e.message ? e.message : "Network error.";
      err.style.display = "block";
      b.disabled = false;
      b.textContent = "Finish setup";
    });
  });
})();
</script>
</body>
</html>
